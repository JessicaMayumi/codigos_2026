<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <header>
  <nav>
    <ul>
      <li><a href="#inserir">Inserir</a></li>
      <li><a href="#listar">Listar</a></li>
      <li><a href="#alterar">Alterar</a></li>
      <li><a href="#excluir">Excluir</a></li>
    </ul>
  </nav>
</header>

<main>
  <!-- Card A: Formulário de inclusão -->
  <section id="inserir">
    <article>
      <h2>Inserir</h2>

      <form>
        <div>
          <label for="nome">Nome</label>
          <input id="nome" name="nome" type="text" placeholder="Digite o nome" />
        </div>

        <div>
          <label for="salario">Salário</label>
          <input id="salario" name="salario" type="number" placeholder="Digite o salário" />
        </div>

        <div>
          <label for="idade">Idade</label>
          <input id="idade" name="idade" type="number" placeholder="Digite a idade" />
        </div>

        <button type="submit">Salvar</button>
      </form>
    </article>
  </section>

  <!-- Card B: Tabela com paginação -->
  <section id="listar">
    <article>
      <h2>Listar</h2>

      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>Salário</th>
            <th>Idade</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody>
          <!-- Exemplo de linha -->
          <tr>
            <td>1</td>
            <td>Maria</td>
            <td>5000</td>
            <td>28</td>
            <td>
              <button type="button">Editar</button>
              <button type="button">Excluir</button>
            </td>
          </tr>
        </tbody>
      </table>

      <div>
        <button type="button">Anterior</button>
        <span>Página 1 de 10</span>
        <button type="button">Próxima</button>
      </div>
    </article>
  </section>

  <!-- Card C: Campo para remover por código -->
  <section id="excluir">
    <article>
      <h2>Excluir</h2>

      <div>
        <label for="codigoExcluir">Código (ID)</label>
        <input id="codigoExcluir" name="codigoExcluir" type="number" placeholder="Digite o ID" />
      </div>

      <button type="button">Remover</button>
    </article>
  </section>

  <!-- Card D: Alterar -->
  <section id="alterar">
    <article>
      <h2>Alterar</h2>

      <form>
        <div>
          <label for="idAlterar">ID</label>
          <input id="idAlterar" name="idAlterar" type="number" placeholder="Digite o ID" />
        </div>

        <div>
          <label for="nomeAlterar">Nome</label>
          <input id="nomeAlterar" name="nomeAlterar" type="text" placeholder="Novo nome" />
        </div>

        <div>
          <label for="salarioAlterar">Salário</label>
          <input id="salarioAlterar" name="salarioAlterar" type="number" placeholder="Novo salário" />
        </div>

        <div>
          <label for="idadeAlterar">Idade</label>
          <input id="idadeAlterar" name="idadeAlterar" type="number" placeholder="Nova idade" />
        </div>

        <button type="submit">Atualizar</button>
      </form>
    </article>
  </section>
</main>
</body>
</html>
